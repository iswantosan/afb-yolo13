# YOLOv13s + P2-Additive detection head.
#
# CONSTRAINT-DRIVEN DESIGN (lessons from failed yolov13s-p2.yaml):
#   The previous P2 variant RESTRUCTURED PAN bottom-up to start from P2.
#   That killed 2 of 7 FullPAD_Tunnel gates (PAN P4/P5 head tunnels became
#   alpha-trap, gate ~ 0) and dropped HyperACE |output| by 60%.
#
#   This variant is PURE ADDITIVE:
#     - Baseline layers 0-31 are byte-identical to ultralytics/cfg/models/v13/yolov13.yaml
#     - All 7 FullPAD_Tunnel layers in original positions, untouched.
#     - PAN bottom-up (P3->P4->P5) UNCHANGED.
#     - HyperACE distribution to head P3/P4/P5 UNCHANGED.
#     - Only adds layers 32-34 (Upsample -> Concat -> DSC3k2) for P2 branch.
#     - Detect at layer 35 takes 4 inputs [P2_new, P3, P4, P5] instead of 3.
#
# Motivation (data-driven):
#   debug_visual.png + GT box size analysis showed:
#     - Bacilli median size: 24 px at imgsz=640 (P25=21 px)
#     - P3 stride=8 grid: ~3x3 cells per bacilli -> borderline sub-pixel issue
#     - mAP@0.9 ~= 0.003 confirms localization bottleneck
#   P2 stride=4 grid gives 6x6 cells per bacilli -> proper sub-pixel regression
#   space without changing input resolution (imgsz=640 fixed).
#
# Cost vs baseline (scale s, imgsz=640):
#   Params: +~0.5M (Upsample + DSC3k2 [256])
#   FLOPs : +~5G (extra processing at 160x160 spatial)
#   Train : +~20% wall time
#
# Pretrained yolov13s.pt:
#   Layers 0-31 load identically (baseline structure preserved).
#   Layer 32 Upsample is parameter-less.
#   Layer 33 Concat is parameter-less.
#   Layer 34 DSC3k2 init from scratch (no matching pretrained weights).
#   Layer 35 Detect: 4-output vs pretrained 3-output -> re-init from scratch.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

# === BACKBONE: identical to baseline yolov13.yaml ===
backbone:
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0  P1/2
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1  P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2  backbone P2 -- consumed by P2-add branch
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3  P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5  P4/16
  - [-1, 4, A2C2f,   [512, True, 4]]              # 6
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7  P5/32
  - [-1, 4, A2C2f,   [1024, True, 1]]             # 8

# === HEAD: layers 9-31 IDENTICAL to baseline (no restructure) ===
head:
  # HyperACE + FullPAD distribution
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]   # 9
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 10
  - [9, 1, DownsampleConv, []]                                       # 11
  - [[6, 9],  1, FullPAD_Tunnel, []]                                 # 12
  - [[4, 10], 1, FullPAD_Tunnel, []]                                 # 13
  - [[8, 11], 1, FullPAD_Tunnel, []]                                 # 14

  # FPN top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 15
  - [[-1, 12], 1, Concat, [1]]                                       # 16
  - [-1, 2, DSC3k2, [512, True]]                                     # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 18

  # FPN top-down P4 -> P3
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                       # 19
  - [[-1, 13], 1, Concat, [1]]                                       # 20
  - [-1, 2, DSC3k2, [256, True]]                                     # 21
  - [10, 1, Conv, [256, 1, 1]]                                       # 22
  - [[21, 22], 1, FullPAD_Tunnel, []]                                # 23  P3 head input

  # PAN bottom-up P3 -> P4 (UNCHANGED from baseline)
  - [-1, 1, Conv, [256, 3, 2]]                                       # 24
  - [[-1, 18], 1, Concat, [1]]                                       # 25
  - [-1, 2, DSC3k2, [512, True]]                                     # 26
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 27  P4 head input

  # PAN bottom-up P4 -> P5 (UNCHANGED from baseline)
  - [26, 1, Conv, [512, 3, 2]]                                       # 28
  - [[-1, 14], 1, Concat, [1]]                                       # 29
  - [-1, 2, DSC3k2, [1024, True]]                                    # 30
  - [[-1, 11], 1, FullPAD_Tunnel, []]                                # 31  P5 head input

  # === NEW: P2-additive branch (layers 32-34) ===
  # Upsample P3 head output (layer 23) to stride 4, concat with backbone P2.
  - [23, 1, nn.Upsample, [None, 2, "nearest"]]                       # 32  P3 head -> P2 res
  - [[-1, 2], 1, Concat, [1]]                                        # 33  cat backbone P2
  - [-1, 2, DSC3k2, [256, True]]                                     # 34  P2 head input

  # === Detect: 4 outputs [P2_new, P3, P4, P5] (layers 34, 23, 27, 31) ===
  - [[34, 23, 27, 31], 1, Detect, [nc]]                              # 35
