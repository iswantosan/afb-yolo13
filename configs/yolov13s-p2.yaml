# YOLOv13 + P2 detection head (stride 4) for small-object detection.
# Designed for high-density small-target microscopy (e.g., AFB bacilli).
#
# Changes vs ultralytics/cfg/models/v13/yolov13.yaml:
#   1. FPN top-down extended to P2 (stride 4).
#   2. PAN bottom-up starts from P2 instead of P3.
#   3. Detect head: 4 outputs (P2, P3, P4, P5) instead of 3 (P3, P4, P5).
#   4. HyperACE + FullPAD distribution pathway preserved unchanged (still
#      operates at P3/P4/P5 like baseline -- no new tunnel to P2 to keep
#      modification minimal and avoid disturbing the already-working
#      hypergraph reasoning).
#
# Cost vs baseline (scale s, imgsz=640):
#   - Params : ~+10-15% (extra DSC3k2 + Conv blocks in P2 path)
#   - FLOPs  : ~+30-40% (large P2 feature map 160x160 dominant)
#   - Train  : ~+25-35% wall time
#
# Pretrained yolov13s.pt loads partial (backbone + P3/P4/P5 neck);
# Detect head re-initialized from scratch (4-vs-3 output mismatch).

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0  P1/2
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1  P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2  backbone P2 (stride 4) -- referenced for P2 head
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3  P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4  backbone P3
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5  P4/16
  - [-1, 4, A2C2f,   [512, True, 4]]              # 6  backbone P4
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7  P5/32
  - [-1, 4, A2C2f,   [1024, True, 1]]             # 8  backbone P5

head:
  # ---- HyperACE + FullPAD distribution (identical to baseline) ----
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]   # 9
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 10
  - [9, 1, DownsampleConv, []]                                       # 11
  - [[6, 9], 1, FullPAD_Tunnel, []]                                  # 12
  - [[4, 10], 1, FullPAD_Tunnel, []]                                 # 13
  - [[8, 11], 1, FullPAD_Tunnel, []]                                 # 14

  # ---- FPN top-down: P5 -> P4 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 15
  - [[-1, 12], 1, Concat, [1]]                                       # 16
  - [-1, 2, DSC3k2, [512, True]]                                     # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 18

  # ---- FPN top-down: P4 -> P3 ----
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                       # 19
  - [[-1, 13], 1, Concat, [1]]                                       # 20
  - [-1, 2, DSC3k2, [256, True]]                                     # 21
  - [10, 1, Conv, [256, 1, 1]]                                       # 22
  - [[21, 22], 1, FullPAD_Tunnel, []]                                # 23  P3 head input

  # ---- FPN top-down extension: P3 -> P2 (NEW) ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 24
  - [[-1, 2], 1, Concat, [1]]                                        # 25  cat backbone P2
  - [-1, 2, DSC3k2, [256, True]]                                     # 26  P2 head input (NEW)

  # ---- PAN bottom-up: P2 -> P3 (NEW path) ----
  - [-1, 1, Conv, [256, 3, 2]]                                       # 27
  - [[-1, 23], 1, Concat, [1]]                                       # 28
  - [-1, 2, DSC3k2, [256, True]]                                     # 29  P3 head input refined

  # ---- PAN bottom-up: P3 -> P4 ----
  - [-1, 1, Conv, [256, 3, 2]]                                       # 30
  - [[-1, 18], 1, Concat, [1]]                                       # 31
  - [-1, 2, DSC3k2, [512, True]]                                     # 32
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 33  P4 head input

  # ---- PAN bottom-up: P4 -> P5 ----
  - [32, 1, Conv, [512, 3, 2]]                                       # 34
  - [[-1, 14], 1, Concat, [1]]                                       # 35
  - [-1, 2, DSC3k2, [1024, True]]                                    # 36
  - [[-1, 11], 1, FullPAD_Tunnel, []]                                # 37  P5 head input

  # ---- 4-scale detection head ----
  - [[26, 29, 33, 37], 1, Detect, [nc]]                              # 38  Detect(P2, P3, P4, P5)
