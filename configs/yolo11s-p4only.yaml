# YOLO11s — SINGLE-SCALE P4 detection head only
# Empirical motivation: P-level analysis shows P4 handles 97.6% of TPs on
# AFB Tuberculosis6208. P3 generates only 2 TPs at the cost of 203 FPs;
# P5 covers 23 large GT but anchor-free DFL regression in P4 can in
# principle handle them given sufficient receptive field via P5 context
# fusion (FPN top-down P5->P4).
# Most aggressive efficiency variant. Paper claim if mAP50 holds:
# "Single-scale stride-16 detection sufficient for AFB on phone-camera
# microscopy" — ~25% params/FLOPs reduction.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]              # 6 P4 features
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10

head:
  # FPN top-down P5 -> P4 fusion only
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat P4 backbone
  - [-1, 2, C3k2, [512, False]]                  # 13 fused P4 detect head
  - [[13], 1, Detect, [nc]]                      # 14 single output
