# YOLO11s — EXTRA DEEP P4 head (n=8, push depth ceiling)
# p4deep (n=4) showed +0.012 mAP50 gain. At scale s with depth_mult=0.5,
# n=4 -> 2 runtime modules; n=8 -> 4 runtime modules. Test whether
# additional depth still helps or if p4deep was already saturating.
# Decision: rising vs flat vs falling distinguishes "depth limit" from
# "depth sweet spot".

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 8, C3k2, [512, False]]             # 13 P4 FPN n=8 (was 2)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]             # 16 P3 head

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 8, C3k2, [512, False]]             # 19 P4 detect head n=8 (was 2)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 22 P5 head

  - [[16, 19, 22], 1, Detect, [nc]]
