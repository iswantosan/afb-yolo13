# YOLO12s — REPLACE P4 detect head A2C2f with C2PSA (transformer attention)
#
# Bring YOLO11's proven self-attention block (C2PSA = stacked PSABlocks with
# multi-head QKV + positional encoding) to the dominant detection scale P4.
# Logic: paper YOLOv10s baseline 0.89 leverages strong feature extraction at
# dominant scale; YOLO12's A2C2f is good but C2PSA explicitly transformer-
# attention design might handle multi-color-background better via cross-spatial
# context modeling.
# All other heads kept. Pure module replacement at single point.

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 4, C3k2Attn, [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 2, A2C2f, [512, True, 1]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 2, A2C2f, [1024, False, -1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]             # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]             # 14 P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C2PSA, [512]]                         # 17 P4 detect REPLACED with C2PSA

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 20 P5

  - [[14, 17, 20], 1, Detect, [nc]]
