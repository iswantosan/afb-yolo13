# YOLO11s + CSA (Coordinate Spatial Attention, PC-YOLO11s, Sensors 2025)
#
# Lightweight ablation isolating only the CSA contribution from PC-YOLO11s.
# Keeps standard P3/P4/P5 head (no P2 add, no P5 remove). CSA inserted after
# each backbone C3k2 stage + before SPPF. Reference: PMC11768384.
#
# Use this together with yolo11s-pc.yaml to disentangle CSA from P2/noP5
# effects (paper ablation table).

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]         # 0
  - [-1, 1, Conv,  [128, 3, 2]]        # 1
  - [-1, 2, C3k2,  [256, False, 0.25]] # 2
  - [-1, 1, CSA,   []]                 # 3  CSA
  - [-1, 1, Conv,  [256, 3, 2]]        # 4
  - [-1, 2, C3k2,  [512, False, 0.25]] # 5
  - [-1, 1, CSA,   []]                 # 6  CSA
  - [-1, 1, Conv,  [512, 3, 2]]        # 7
  - [-1, 2, C3k2,  [512, True]]        # 8
  - [-1, 1, CSA,   []]                 # 9  CSA
  - [-1, 1, Conv,  [1024, 3, 2]]       # 10
  - [-1, 2, C3k2,  [1024, True]]       # 11
  - [-1, 1, CSA,   []]                 # 12 CSA before SPPF
  - [-1, 1, SPPF,  [1024, 5]]          # 13
  - [-1, 2, C2PSA, [1024]]             # 14

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]                    # cat P4 (after CSA #9)
  - [-1, 2, C3k2, [512, False]]                  # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                    # cat P3 (after CSA #6)
  - [-1, 2, C3k2, [256, False]]                  # 20 (P3)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 23 (P4)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]                   # cat C2PSA
  - [-1, 2, C3k2, [1024, True]]                  # 26 (P5)

  - [[20, 23, 26], 1, Detect, [nc]]              # 27
