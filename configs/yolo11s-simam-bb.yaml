# YOLO11s + SimAM throughout backbone (zero-cost coverage ablation)
# Hypothesis: max coverage falsifier. SimAM is parameter-free, zero added
# FLOPs at inference. Insert after EVERY C3k2 stage in backbone (4 stages:
# early, P3, P4, P5). If even maximum coverage zero-cost attention can't
# move mAP50, attention as a class is decided on this dataset. Cheapest
# possible "is attention worth it at all" test.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]               # 0
  - [-1, 1, Conv, [128, 3, 2]]              # 1
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, SimAM, []]                      # 3
  - [-1, 1, Conv, [256, 3, 2]]              # 4
  - [-1, 2, C3k2, [512, False, 0.25]]       # 5 P3
  - [-1, 1, SimAM, []]                      # 6
  - [-1, 1, Conv, [512, 3, 2]]              # 7
  - [-1, 2, C3k2, [512, True]]              # 8 P4
  - [-1, 1, SimAM, []]                      # 9
  - [-1, 1, Conv, [1024, 3, 2]]             # 10
  - [-1, 2, C3k2, [1024, True]]             # 11
  - [-1, 1, SimAM, []]                      # 12
  - [-1, 1, SPPF, [1024, 5]]                # 13
  - [-1, 2, C2PSA, [1024]]                  # 14 (kept)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 9], 1, Concat, [1]]                    # 16 cat P4-attended
  - [-1, 2, C3k2, [512, False]]                  # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 6], 1, Concat, [1]]                    # 19 cat P3-attended
  - [-1, 2, C3k2, [256, False]]                  # 20 P3 head

  - [-1, 1, Conv, [256, 3, 2]]                   # 21
  - [[-1, 17], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [512, False]]                  # 23 P4 head

  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 14], 1, Concat, [1]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                  # 26 P5 head

  - [[20, 23, 26], 1, Detect, [nc]]
