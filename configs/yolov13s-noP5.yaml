# YOLOv13s without P5 detection branch (Level 2 strip).
#
# Empirically motivated by:
#   1. GT box size analysis: bacilli median 24px at imgsz=640.
#      P5 stride 32 = each grid cell covers 32x32 px -> bacilli FIT entirely
#      in one P5 cell with no inter-cell signal -> P5 head cannot localize.
#   2. (To verify) Direct ablation: zero P5 outputs in baseline best.pt,
#      compare mAP. Expected delta < 0.003 mAP50 -> safe to remove.
#
# Changes vs baseline yolov13.yaml:
#   Removed PAN bottom-up P4 -> P5 chain (layers 28-31 in baseline):
#     - Conv [512, 3, 2]            (was layer 28)
#     - Concat [-1, 14]              (was layer 29)
#     - DSC3k2 [1024, True]          (was layer 30, ~1.3M params)
#     - FullPAD_Tunnel [-1, 11]      (was layer 31, P5 head input)
#   Detect head: 2 outputs [P3, P4] (was [P3, P4, P5]).
#
# UNCHANGED (intentional):
#   - Backbone (layers 0-8): identical. Layer 8 backbone P5 still produces
#     features for HyperACE input [4, 6, 8].
#   - HyperACE layer 9: identical. Still 3-scale input.
#   - DownsampleConv layer 11: still feeds FullPAD #3 layer 14.
#   - FullPAD distribution: 6 of 7 tunnels remain (only #7 removed).
#   - FPN top-down P5 -> P4 -> P3 chain (layers 15-23): unchanged.
#   - PAN bottom-up P3 -> P4 chain (layers 24-27): unchanged.
#
# Cost saving vs baseline (scale s):
#   Params: -2.0M (-22%, mostly DSC3k2 [1024] at layer 30)
#   FLOPs : -3.5G (-17%, 1024-channel ops at P5 resolution)
#   FPS   : expect +10-15% inference speedup
#
# mAP expected:
#   mAP50 / mAP50-95: roughly identical to baseline IF P5 ablation
#   confirms < 0.005 mAP delta. To be verified empirically.
#
# Pretrained yolov13s.pt loads partial:
#   Layers 0-27 identical structure -> full transfer.
#   Layer 28 Detect now [P3, P4] (2 outputs vs pretrained 3) -> re-init.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0  P1/2
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1  P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3  P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5  P4/16
  - [-1, 4, A2C2f,   [512, True, 4]]              # 6
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7  P5/32 -- kept for HyperACE input
  - [-1, 4, A2C2f,   [1024, True, 1]]             # 8  P5 backbone -- HyperACE input

head:
  # HyperACE + FullPAD distribution (unchanged)
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]   # 9
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 10
  - [9, 1, DownsampleConv, []]                                       # 11
  - [[6, 9],  1, FullPAD_Tunnel, []]                                 # 12
  - [[4, 10], 1, FullPAD_Tunnel, []]                                 # 13
  - [[8, 11], 1, FullPAD_Tunnel, []]                                 # 14  (feeds FPN top-down start)

  # FPN top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 15
  - [[-1, 12], 1, Concat, [1]]                                       # 16
  - [-1, 2, DSC3k2, [512, True]]                                     # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 18

  # FPN top-down P4 -> P3
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                       # 19
  - [[-1, 13], 1, Concat, [1]]                                       # 20
  - [-1, 2, DSC3k2, [256, True]]                                     # 21
  - [10, 1, Conv, [256, 1, 1]]                                       # 22
  - [[21, 22], 1, FullPAD_Tunnel, []]                                # 23  P3 head input

  # PAN bottom-up P3 -> P4 (kept)
  - [-1, 1, Conv, [256, 3, 2]]                                       # 24
  - [[-1, 18], 1, Concat, [1]]                                       # 25
  - [-1, 2, DSC3k2, [512, True]]                                     # 26
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 27  P4 head input

  # PAN bottom-up P4 -> P5 REMOVED (was layers 28-31)
  # Detect: 2 outputs [P3, P4]
  - [[23, 27], 1, Detect, [nc]]                                      # 28
