# YOLO11s — SINGLE CBAM at P4 detect input only
# Hypothesis: prior multi-point attention failures (cbam-neck 4 inserts,
# ca-p3 2 inserts, etc) may stem from systemic disruption to pretrained
# gradient flow. SINGLE attention insert at the dominant detection scale
# (P4 only) preserves all other paths intact — minimum perturbation test.
# Parallel branch from layer 19 (PAN P4 detect head); P3 and P5 paths
# bypass any attention.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]              # 16 P3 detect head

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]              # 19 PAN P4 head

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]              # 22 P5 detect head

  - [19, 1, CBAM, [7]]                       # 23 SINGLE CBAM at P4 path
  - [[16, 23, 22], 1, Detect, [nc]]
