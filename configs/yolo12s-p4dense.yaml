# YOLO12s — DENSE-AGGREGATION at P4 (extra cross-scale fusion)
#
# Inject extra P3 and P5 features INTO P4 detect head via additional Concat.
# Standard PAN feeds P4 only from FPN P4 + downsampled P3. This variant adds
# upsampled P5 features as third input to P4 detect head — richer multi-scale
# context at dominant scale.
# All heads kept. Adds 1 Upsample + 1 Concat in P4 detect path.

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 4, C3k2Attn, [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 2, A2C2f, [512, True, 1]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 2, A2C2f, [1024, False, -1]]            # 8 P5 features

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]             # 11 P4 FPN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]             # 14 P3 detect head

  - [-1, 1, Conv, [256, 3, 2]]                    # 15 P3 down to P4
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]    # 16 P5 up to P4 (extra cross-scale)
  - [[15, 11, 16], 1, Concat, [1]]               # 17 fuse [P3-down, P4-FPN, P5-up]
  - [-1, 4, A2C2f, [512, False, -1]]             # 18 P4 detect head DEEPER aggregation

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 21 P5

  - [[14, 18, 21], 1, Detect, [nc]]
