# YOLO11s + SPDConv backbone (Sunkara & Luo 2022 ECML, arXiv:2208.03641)
#
# Replace all 4 stride-2 Conv layers in backbone with SPDConv (space-to-depth).
# Avoid information loss from strided downsampling. Critical for small obj:
# AFB bacilli ~5-15px, every stride-2 step normally aliases features.
#
# SPDConv: pixel_unshuffle(2) -> Conv1x1 -> BN -> SiLU. Same output shape as
# stride-2 Conv but zero feature loss in downsampling step.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]         # 0-P1/2  (stem kept as plain Conv)
  - [-1, 1, SPDConv, [128]]              # 1-P2/4  SPD
  - [-1, 2, C3k2,    [256, False, 0.25]] # 2
  - [-1, 1, SPDConv, [256]]              # 3-P3/8  SPD
  - [-1, 2, C3k2,    [512, False, 0.25]] # 4
  - [-1, 1, SPDConv, [512]]              # 5-P4/16 SPD
  - [-1, 2, C3k2,    [512, True]]        # 6
  - [-1, 1, SPDConv, [1024]]             # 7-P5/32 SPD
  - [-1, 2, C3k2,    [1024, True]]       # 8
  - [-1, 1, SPPF,    [1024, 5]]          # 9
  - [-1, 2, C2PSA,   [1024]]             # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                    # cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                    # cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]              # 23 Detect(P3, P4, P5)
