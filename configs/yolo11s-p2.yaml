# YOLO11s + P2 small-object detection head (160x160 stride 4)
#
# Add a P2/4 detection scale on top of standard P3/P4/P5. Architectural prior
# art for P2 head: NanoDet/YOLOR/many small-obj papers; specific use here
# follows PC-YOLO11s (Sensors 2025, PMC11768384) and YOLO11-4K
# (arXiv:2512.16493) which both add P2 for small-obj benchmarks.
#
# Detect on [P2, P3, P4, P5] -> 4 scales. Higher recall on small bacilli.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]# 2  (backbone P2 feature, ch=128 scaled)
  - [-1, 1, Conv,  [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]# 4  (backbone P3 feature)
  - [-1, 1, Conv,  [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2,  [512, True]]       # 6  (backbone P4 feature)
  - [-1, 1, Conv,  [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2,  [1024, True]]      # 8  (backbone P5 feature)
  - [-1, 1, SPPF,  [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]            # 10 (backbone P5 attention)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13 (head P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16 (head P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 ← NEW upsample to P2
  - [[-1, 2], 1, Concat, [1]]                    # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]]                  # 19 (P2/4 detect)

  - [-1, 1, Conv, [128, 3, 2]]                   # 20 bottom-up to P3
  - [[-1, 16], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [256, False]]                  # 22 (P3/8 detect)

  - [-1, 1, Conv, [256, 3, 2]]                   # 23 bottom-up to P4
  - [[-1, 13], 1, Concat, [1]]                   # 24
  - [-1, 2, C3k2, [512, False]]                  # 25 (P4/16 detect)

  - [-1, 1, Conv, [512, 3, 2]]                   # 26 bottom-up to P5
  - [[-1, 10], 1, Concat, [1]]                   # 27 cat C2PSA
  - [-1, 2, C3k2, [1024, True]]                  # 28 (P5/32 detect)

  - [[19, 22, 25, 28], 1, Detect, [nc]]          # 29 Detect(P2, P3, P4, P5)
