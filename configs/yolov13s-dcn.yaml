# YOLOv13s + DCNv2 (Zhu et al. CVPR 2019, modulated deformable conv)
#
# Replace PAN bottom-up downsample Conv (3x3 stride 2) di layer 24 & 28
# dengan DCNv2Block. DCN adaptive receptive field cocok untuk elongated
# bacilli random orientation. torchvision.ops.deform_conv2d backend.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5
  - [-1, 4, A2C2f,   [512, True, 4]]              # 6
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7
  - [-1, 4, A2C2f,   [1024, True, 1]]             # 8

head:
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]   # 9
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 10
  - [9, 1, DownsampleConv, []]                                       # 11
  - [[6, 9],  1, FullPAD_Tunnel, []]                                 # 12
  - [[4, 10], 1, FullPAD_Tunnel, []]                                 # 13
  - [[8, 11], 1, FullPAD_Tunnel, []]                                 # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 15
  - [[-1, 12], 1, Concat, [1]]                                       # 16
  - [-1, 2, DSC3k2, [512, True]]                                     # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 18

  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                       # 19
  - [[-1, 13], 1, Concat, [1]]                                       # 20
  - [-1, 2, DSC3k2, [256, True]]                                     # 21
  - [10, 1, Conv, [256, 1, 1]]                                       # 22
  - [[21, 22], 1, FullPAD_Tunnel, []]                                # 23

  # PAN bottom-up: replace 3x3 Conv stride 2 with DCNv2Block
  - [-1, 1, DCNv2Block, [256, 3, 2, 1]]                              # 24  DCN P3->P4
  - [[-1, 18], 1, Concat, [1]]                                       # 25
  - [-1, 2, DSC3k2, [512, True]]                                     # 26
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 27

  - [26, 1, DCNv2Block, [512, 3, 2, 1]]                              # 28  DCN P4->P5
  - [[-1, 14], 1, Concat, [1]]                                       # 29
  - [-1, 2, DSC3k2, [1024, True]]                                    # 30
  - [[-1, 11], 1, FullPAD_Tunnel, []]                                # 31

  - [[23, 27, 31], 1, Detect, [nc]]                                  # 32
