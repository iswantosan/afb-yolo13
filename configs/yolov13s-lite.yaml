# YOLOv13s-Lite -- FPS-focused variant for point-of-care AFB deployment.
#
# Motivation:
#   TB / AFB diagnosis in low-resource settings increasingly relies on
#   phone-camera microscopy. Models for these scenarios need real-time
#   inference on edge hardware (mobile GPU, Raspberry Pi 5, Jetson Nano).
#   YOLOv13's HyperACE + FullPAD distribution pathway is expressive but
#   dominates FLOPs (~30% of total). This Lite variant drops both, relying
#   on standard FPN-PAN + CBAM (Convolutional Block Attention Module) to
#   recover some discriminative power.
#
# Changes vs ultralytics/cfg/models/v13/yolov13.yaml:
#   1. Drop HyperACE (layer 9) and DownsampleConv (layer 11).
#   2. Drop all 7 FullPAD_Tunnel layers.
#   3. Drop A2C2f -> use lighter C3k2 in backbone P4/P5 stages.
#   4. Add CBAM after each FPN/PAN DSC3k2 to compensate for lost capacity.
#   5. Keep DSConv stem + downsamples (backbone is already light).
#
# Cost vs baseline (scale s, imgsz=640):
#   Params: ~6-7M (vs 9M baseline, -30%)
#   FLOPs : ~12-14 GFLOPs (vs 21 GFLOPs baseline, -35%)
#   FPS   : expect 1.5-2x improvement on A100, larger on edge devices
#
# mAP expectation: -1 to -2 mAP50 (trade-off acceptable for deployment).
#
# Pretrained yolov13s.pt: loads partial (backbone DSConv layers OK,
# A2C2f / HyperACE / FullPAD weights skipped -- different structure).
# Recommend train from scratch or load YOLOv12s.pt instead.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0  P1/2
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1  P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3  P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4  P3 features
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5  P4/16
  - [-1, 2, C3k2,    [512, False]]                # 6  P4 features (lite: C3k2 instead of A2C2f)
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7  P5/32
  - [-1, 2, C3k2,    [1024, True]]                # 8  P5 features (lite: C3k2 instead of A2C2f)

head:
  # Standard FPN top-down (no HyperACE/FullPAD)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 9
  - [[-1, 6], 1, Concat, [1]]                     # 10
  - [-1, 2, DSC3k2, [512, True]]                  # 11
  - [-1, 1, CBAM, []]                             # 12  channel + spatial attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 2, DSC3k2, [256, True]]                  # 15  P3 head
  - [-1, 1, CBAM, []]                             # 16

  # PAN bottom-up
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 12], 1, Concat, [1]]                    # 18
  - [-1, 2, DSC3k2, [512, True]]                  # 19  P4 head
  - [-1, 1, CBAM, []]                             # 20

  - [-1, 1, Conv, [512, 3, 2]]                    # 21
  - [[-1, 8], 1, Concat, [1]]                     # 22
  - [-1, 2, DSC3k2, [1024, True]]                 # 23  P5 head
  - [-1, 1, CBAM, []]                             # 24

  - [[16, 20, 24], 1, Detect, [nc]]               # 25  Detect(P3, P4, P5)
