# YOLO11s + CoordAtt at neck fusion points
# Hypothesis: orientation-aware attention at multi-scale fusion stage. CA
# preserves H/W positional info along orthogonal axis — useful when fused
# features from different scales need to retain rod orientation. 4 CA
# inserts at the 4 Concat outputs.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, CoordAtt, [32]]                 # 13
  - [-1, 2, C3k2, [512, False]]             # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, CoordAtt, [32]]                 # 17
  - [-1, 2, C3k2, [256, False]]             # 18 P3 head

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, CoordAtt, [32]]                 # 21
  - [-1, 2, C3k2, [512, False]]             # 22 P4 head

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, CoordAtt, [32]]                 # 25
  - [-1, 2, C3k2, [1024, True]]             # 26 P5 head

  - [[18, 22, 26], 1, Detect, [nc]]
