# YOLO12s + IBN (Instance-Batch hybrid Normalization) di stem
# Pan et al. ECCV 2018 (arXiv:1807.09441)
#
# Mekanisme: replace BatchNorm di first 2 stem convs dengan IBN hybrid:
#   - 50% channels -> InstanceNorm (strip per-image color/style statistics)
#   - 50% channels -> BatchNorm (preserve discriminative features)
# Target: background-color invariance untuk Raw_Sputum 4-bg-color distribution
# (Yellowish / Purplish-Pinkish / Bluish / Greenish).
#
# Diagnostic motivation: stratified evaluation menunjukkan Greenish/Bluish
# strata underperform 10% vs Purplish/Pinkish (best). IBN targets this gap
# secara langsung — color invariance via instance-norm pada early features.

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, IBNConv, [64, 3, 2]]                # 0 — was Conv, now IBN stem
  - [-1, 1, IBNConv, [128, 3, 2, 1, 2]]         # 1 — was Conv, now IBN stem
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]           # 3-P3/8
  - [-1, 4, C3k2Attn,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]                  # 5-P4/16
  - [-1, 2, A2C2f,  [512, True, 1]]
  - [-1, 1, Conv,  [1024, 3, 2]]                 # 7-P5/32
  - [-1, 2, A2C2f,  [1024, False, -1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]             # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]             # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]             # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2Attn, [1024, True]]              # 20

  - [[14, 17, 20], 1, Detect, [nc]]
