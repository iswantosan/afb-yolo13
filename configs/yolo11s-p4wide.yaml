# YOLO11s — WIDEN P4 detection head channels (strengthen dominant scale)
# Empirical motivation: P4 carries 97.6% of TPs but has same channel
# budget (512 base = 256 at scale s) as P3/P5. Widen the P4 path
# specifically — FPN P4 intermediate AND PAN P4 detect head — to 768
# (= 384 ch at s scale).
# Pure rescale: no new module type, same C3k2 family. Pretrained matching
# weights still partially transfer; extra channels Kaiming-init.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, False]]             # 13 P4 FPN WIDER (was 512)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]             # 16 P3 head (unchanged)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, False]]             # 19 P4 detect head WIDER (was 512)

  - [-1, 1, Conv, [768, 3, 2]]              # 20 down-sample updated input ch
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 22 P5 head (unchanged)

  - [[16, 19, 22], 1, Detect, [nc]]
