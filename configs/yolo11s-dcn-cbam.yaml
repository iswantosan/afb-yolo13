# YOLO11 + DCNv2 (orientation) + CBAM (noise suppression)
# Composite: addresses BOTH diagnose-identified failure modes simultaneously.
#   - DCNv2 in PAN bottom-up: adaptive receptive field tracks rod orientation
#   - CBAM before Detect: channel+spatial attention suppresses ZN-stain noise
# Paper claim: "rod-aware detection neck combining deformable aggregation
# with attention-guided noise suppression for AFB microscopy".

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, DCNv2Block, [256, 3, 2, 1]]  # 17 deformable down-sample
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 19

  - [-1, 1, DCNv2Block, [512, 3, 2, 1]]  # 20 deformable down-sample
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 22

  - [16, 1, CBAM, [7]]  # 23
  - [19, 1, CBAM, [7]]  # 24
  - [22, 1, CBAM, [7]]  # 25
  - [[23, 24, 25], 1, Detect, [nc]]
