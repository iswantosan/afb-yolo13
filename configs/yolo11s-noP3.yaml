# YOLO11s — DROP P3 detection head (keep P4 + P5)
# Empirical motivation: P-level analysis shows P3 generates 203 FP for only
# 2 TP (0.2% of TPs). It is net TOXIC for this medium-bacilli dataset.
# Removing P3 path eliminates the noise generator while keeping the dominant
# P4 head and P5 large-obj coverage (23/23 recall).
# Expected: mAP50 flat-or-improved (precision gain from FP removal), params
# reduced ~15%, inference faster.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4 (P3 features still computed, unused downstream)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]              # 6 P4 features
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10

head:
  # FPN top-down P5 -> P4 only (no descent to P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat P4 backbone
  - [-1, 2, C3k2, [512, False]]                  # 13 P4 detect head
  # PAN bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                   # 14 down P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                   # 15 cat C2PSA
  - [-1, 2, C3k2, [1024, True]]                  # 16 P5 detect head
  - [[13, 16], 1, Detect, [nc]]                  # 17 only P4 + P5
