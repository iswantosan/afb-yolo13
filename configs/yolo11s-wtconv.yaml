# YOLO11s + WTConv backbone (Finder et al. ECCV 2024, arXiv:2407.05848)
#
# Replace each backbone C3k2 with WTConv (Haar wavelet decompose -> depthwise
# conv on sub-bands -> reconstruct + residual). Used by MS-YOLOv11 (Sensors
# 2025, PMC12526788) which reports +2.58% mAP50 on DIOR-R and +48% FPS.
#
# Wavelet preserves high-frequency edges -> matches AFB rod morphology
# (elongated thin shapes have strong edge cues).
#
# Note: WTConv has implicit large receptive field (5x5 kernel on sub-bands
# = ~10x10 in spatial domain after IDWT). Memory heavier than C3k2 since
# internal channels = 4 * c2 during depthwise step.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,   [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv,   [128, 3, 2]]       # 1-P2/4
  - [-1, 1, WTConv, [256]]             # 2  WT replaces C3k2
  - [-1, 1, Conv,   [256, 3, 2]]       # 3-P3/8
  - [-1, 1, WTConv, [512]]             # 4  WT
  - [-1, 1, Conv,   [512, 3, 2]]       # 5-P4/16
  - [-1, 1, WTConv, [512]]             # 6  WT
  - [-1, 1, Conv,   [1024, 3, 2]]      # 7-P5/32
  - [-1, 1, WTConv, [1024]]            # 8  WT
  - [-1, 1, SPPF,   [1024, 5]]         # 9
  - [-1, 2, C2PSA,  [1024]]            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 19 (P4)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 22 (P5)

  - [[16, 19, 22], 1, Detect, [nc]]              # 23
