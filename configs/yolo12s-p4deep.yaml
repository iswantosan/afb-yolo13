# YOLO12s — DEEPER P4 detection head (strengthen dominant scale)
#
# Diagnostic motivation: P-level analysis menunjukkan P4 carries 93.6% of
# TPs. Recall sudah saturated (P4: 99%) tapi precision bisa di-improve.
# Deepen P4 path (A2C2f repeat 2 -> 4) tambah representational capacity
# di scale dominant.
#
# Konsisten dengan finding T6208 sebelumnya (yolo11s-p4deep +1.2% mAP50,
# arch lever paling reliable di project ini).
#
# Pure rescale — no new module type. Pretrained partial transfer applies.

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 4, C3k2Attn, [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 2, A2C2f, [512, True, 1]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 2, A2C2f, [1024, False, -1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 4, A2C2f, [512, False, -1]]                 # 11 P4 FPN DEEPER (n=2 -> n=4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]                 # 14 P3 head (unchanged)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 4, A2C2f, [512, False, -1]]                 # 17 P4 detect head DEEPER

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                      # 20 P5 head

  - [[14, 17, 20], 1, Detect, [nc]]
