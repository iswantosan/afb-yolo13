# YOLO11s + CBAM at neck fusion points (after each Concat)
# Hypothesis: attention right after multi-scale feature fusion (Concat) where
# features get mixed — different scales weighted by relevance. Complements
# C2PSA (which only sees P5) by adding fusion-aware attention at P3/P4/P5
# fusion outputs. 4 CBAM inserts total at fusion bottlenecks.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 P4 fusion
  - [-1, 1, CBAM, [7]]                           # 13 attn after P4 fusion
  - [-1, 2, C3k2, [512, False]]                  # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                    # 16 P3 fusion
  - [-1, 1, CBAM, [7]]                           # 17 attn after P3 fusion
  - [-1, 2, C3k2, [256, False]]                  # 18 P3 head

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 14], 1, Concat, [1]]                   # 20 P4 bottom-up fusion
  - [-1, 1, CBAM, [7]]                           # 21 attn
  - [-1, 2, C3k2, [512, False]]                  # 22 P4 head

  - [-1, 1, Conv, [512, 3, 2]]                   # 23
  - [[-1, 10], 1, Concat, [1]]                   # 24 P5 fusion
  - [-1, 1, CBAM, [7]]                           # 25 attn
  - [-1, 2, C3k2, [1024, True]]                  # 26 P5 head

  - [[18, 22, 26], 1, Detect, [nc]]
