# YOLOv13 variant: HyperACE with 16 hyperedges (was 8).
#
# Targets: enrich high-order modeling capacity for dense small-object scenes.
# Tuberculosis6208 has avg ~8 bacilli/image (1171 GT / 140 val images) with
# spatial clustering. Default 8 hyperedges means ~1 hyperedge per bacilli on
# average -- low capacity to model object-object interactions among clusters.
#
# 16 hyperedges = 2x prototype capacity. AdaHyperedgeGen learns richer
# context-conditioned prototypes; AdaHGConv message-passes through more
# hyperedges before aggregating back to vertices.
#
# Changes vs baseline yolov13.yaml:
#   HyperACE args (layer 9):
#     - was: [512,  8, True, True, 0.5, 1, "both"]
#     - now: [512, 16, True, True, 0.5, 1, "both"]
#
# At scale s: he = 16 (no scaling).
# At scale n: he = int(16 * 0.5) = 8.
# At scale x: he = int(16 * 1.5) = 24.
#
# UNCHANGED (intentionally):
#   - Backbone, FPN connectivity, PAN connectivity, FullPAD_Tunnel layout.
#   - Detect head (3 outputs, same scales).
#   - All other modules.
#
# Cost vs baseline (scale s):
#   Params: +~50K in HyperACE (prototype_base [16,512] + context_net
#           [1024, 16*512] + small additions).
#   FLOPs:  marginal increase in AdaHGConv (16x messages vs 8x).
#
# Pretrained yolov13s.pt:
#   - HyperACE prototype/projection shapes mismatch -> those weights re-init.
#   - Backbone + rest of FPN + PAN + Detect load OK.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]                  # 0  P1/2
  - [-1, 1, Conv,    [128, 3, 2, 1, 2]]           # 1  P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]]          # 2
  - [-1, 1, Conv,    [256, 3, 2, 1, 4]]           # 3  P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]]          # 4
  - [-1, 1, DSConv,  [512, 3, 2]]                 # 5  P4/16
  - [-1, 4, A2C2f,   [512, True, 4]]              # 6
  - [-1, 1, DSConv,  [1024, 3, 2]]                # 7  P5/32
  - [-1, 4, A2C2f,   [1024, True, 1]]             # 8

head:
  - [[4, 6, 8], 2, HyperACE, [512, 16, True, True, 0.5, 1, "both"]]  # 9  he=16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 10
  - [9, 1, DownsampleConv, []]                                       # 11
  - [[6, 9],  1, FullPAD_Tunnel, []]                                 # 12
  - [[4, 10], 1, FullPAD_Tunnel, []]                                 # 13
  - [[8, 11], 1, FullPAD_Tunnel, []]                                 # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 15
  - [[-1, 12], 1, Concat, [1]]                                       # 16
  - [-1, 2, DSC3k2, [512, True]]                                     # 17
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 18

  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                       # 19
  - [[-1, 13], 1, Concat, [1]]                                       # 20
  - [-1, 2, DSC3k2, [256, True]]                                     # 21
  - [10, 1, Conv, [256, 1, 1]]                                       # 22
  - [[21, 22], 1, FullPAD_Tunnel, []]                                # 23

  - [-1, 1, Conv, [256, 3, 2]]                                       # 24
  - [[-1, 18], 1, Concat, [1]]                                       # 25
  - [-1, 2, DSC3k2, [512, True]]                                     # 26
  - [[-1, 9], 1, FullPAD_Tunnel, []]                                 # 27

  - [26, 1, Conv, [512, 3, 2]]                                       # 28
  - [[-1, 14], 1, Concat, [1]]                                       # 29
  - [-1, 2, DSC3k2, [1024, True]]                                    # 30
  - [[-1, 11], 1, FullPAD_Tunnel, []]                                # 31

  - [[23, 27, 31], 1, Detect, [nc]]                                  # 32  Detect(P3, P4, P5)
