# YOLO12s — DROP P3 detection head (keep P4 + P5)
#
# Diagnostic motivation: P-level analysis pada Raw_Sputum menunjukkan P3
# generates 357 FP untuk hanya 2 TP (0.2% TP share, P3 recall 18.2%). P3
# head net TOXIC pada dataset bacilli medium-sized (median 65px native).
#
# Konsisten dengan finding pada Tuberculosis6208 (sebelumnya): P3 noise
# generator pada AFB phone-camera microscopy karena bacilli median size
# masuk medium bucket (P4 stride 16).
#
# Drop P3 path → eliminate noise source + reduce ~15% params, P4+P5 sudah
# cover 99.8% TPs.

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]               # 3-P3/8 (still computed, unused downstream)
  - [-1, 4, C3k2Attn, [512, False, 0.25]]            # 4 P3 features
  - [-1, 1, Conv,  [512, 3, 2]]                      # 5-P4/16
  - [-1, 2, A2C2f, [512, True, 1]]                   # 6 P4 features
  - [-1, 1, Conv,  [1024, 3, 2]]                     # 7-P5/32
  - [-1, 2, A2C2f, [1024, False, -1]]                # 8 P5 features

head:
  # FPN top-down P5 -> P4 only (no descent to P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]                 # 11 P4 detect head

  # PAN bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                      # 14 P5 detect head

  - [[11, 14], 1, Detect, [nc]]                      # 2-output Detect (P4 + P5)
