# YOLO11 + DCNv2 (Modulated Deformable Conv, Zhu et al. CVPR 2019)
# Replaces the two stride-2 down-sample Convs in PAN bottom-up path with
# DCNv2. Learned offsets + modulation mask provide adaptive receptive field
# — sampling positions can shift along the rod axis regardless of in-plane
# rotation. Direct architectural answer to "elongated rod orientation".

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, DCNv2Block, [256, 3, 2, 1]]  # 17 (was Conv, now DCNv2)
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 19

  - [-1, 1, DCNv2Block, [512, 3, 2, 1]]  # 20 (was Conv, now DCNv2)
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 22

  - [[16, 19, 22], 1, Detect, [nc]]
