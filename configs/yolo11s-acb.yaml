# YOLO11s + ACBlock (Asymmetric Convolution Block, Ding et al. ICCV 2019)
#
# Domain-motivated arch mod: AFB bacilli are elongated rods (length:width
# ratio ~5:1). Standard 3x3 isotropic conv has no orientation bias. ACB
# adds parallel 1x3 + 3x1 branches to standard 3x3 → enriched directional
# feature extraction.
#
# Insert 1 ACBlock per detection head branch (P3 + P4 + P5), placed AFTER
# the final C3k2 just before Detect. Backbone untouched → full pretrained
# transfer. Asymmetric branches zero-initialized → block starts identical
# to a 3x3 Conv (no baseline degradation at epoch 0).
#
# Prior art: arXiv:1908.03930 (ACNet). 2400+ citations.
# Re-parameterizable to 3x3 at inference if needed.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:                    # UNCHANGED from stock yolo11s
  - [-1, 1, Conv,    [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv,    [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2,    [256, False, 0.25]] # 2
  - [-1, 1, Conv,    [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2,    [512, False, 0.25]] # 4
  - [-1, 1, Conv,    [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2,    [512, True]]        # 6
  - [-1, 1, Conv,    [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2,    [1024, True]]       # 8
  - [-1, 1, SPPF,    [1024, 5]]          # 9
  - [-1, 2, C2PSA,   [1024]]             # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3 features)
  - [-1, 1, ACBlock, [256]]                      # 17 ACB-P3 (elongated rods)

  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 13], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [512, False]]                  # 20 (P4 features)
  - [-1, 1, ACBlock, [512]]                      # 21 ACB-P4

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 10], 1, Concat, [1]]                   # 23
  - [-1, 2, C3k2, [1024, True]]                  # 24 (P5 features)
  - [-1, 1, ACBlock, [1024]]                     # 25 ACB-P5

  - [[17, 21, 25], 1, Detect, [nc]]              # 26
